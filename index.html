<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishini & Isuru | Wedding Planner</title>
    <style>
        :root {
            --sage-green: #A3B18A;
            --glass-bg: rgba(20, 30, 20, 0.65);
            --glass-border: rgba(163, 177, 138, 0.3);
            --text-light: #EAEAEA;
        }
        
        body, html {
            margin: 0; padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--text-light);
            background-color: #111;
            scroll-behavior: smooth;
        }

        /* Hero */
        .hero-section {
            height: 100vh;
            background-image: linear-gradient(rgba(10, 15, 10, 0.4), rgba(10, 15, 10, 0.8)), url('couple_image_1.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .hero-section img.logo { width: 120px; margin-bottom: 20px; filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.8)); }
        .hero-section h1 { font-weight: 300; letter-spacing: 6px; color: var(--sage-green); font-size: 2.5rem; margin: 0; }
        
        .scroll-down {
            position: absolute; bottom: 40px; text-decoration: none; color: var(--text-light);
            font-size: 0.9em; letter-spacing: 2px; animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }

        /* Container & Panels */
        .app-container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; min-height: 100vh; }
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 40px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* Tabs */
        .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
        .tab-button {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-light);
            padding: 12px 20px; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        .tab-button:hover, .tab-button.active { background: rgba(163, 177, 138, 0.3); border-color: var(--sage-green); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Dashboard */
        .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .stat-card { background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 20px; border-radius: 12px; text-align: center; }
        .stat-card h3 { color: var(--sage-green); margin: 0 0 10px 0; font-size: 2rem;}
        .stat-card p { margin: 0; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; color: #ccc;}

        /* Forms */
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9em; color: #ccc; }
        input, select, textarea {
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border);
            color: var(--text-light); border-radius: 6px; box-sizing: border-box; outline: none; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--sage-green); }
        button.submit-btn {
            width: 100%; background: rgba(163, 177, 138, 0.2); border: 1px solid var(--sage-green);
            color: var(--text-light); padding: 15px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        button.submit-btn:hover { background: var(--sage-green); color: #111; font-weight: bold; }

        /* Lists */
        .list-item {
            background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border); padding: 15px; border-radius: 8px; 
            margin-top: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .list-item h4 { margin: 0 0 5px 0; color: var(--sage-green); }
        .list-item p { margin: 0; font-size: 0.9em; color: #bbb; }
        .edit-btn { background: transparent; border: 1px solid var(--sage-green); color: var(--sage-green); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .edit-btn:hover { background: var(--sage-green); color: #111; }
        input[type="hidden"] { display: none; }

        /* Seating Drag & Drop */
        .seating-dashboard { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        .unassigned-zone {
            flex: 1; min-width: 250px; background: rgba(0,0,0,0.4); border: 1px dashed var(--sage-green); 
            border-radius: 8px; padding: 15px; min-height: 300px;
        }
        .tables-zone { flex: 2; display: flex; gap: 15px; flex-wrap: wrap; }
        .wedding-table {
            width: 200px; min-height: 250px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); 
            border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .wedding-table h4 { margin: 0 0 10px 0; color: var(--sage-green); border-bottom: 1px solid var(--glass-border); padding-bottom: 5px; width: 100%; text-align: center; }
        .drop-area { flex-grow: 1; width: 100%; min-height: 150px; }
        .guest-card {
            background: rgba(163, 177, 138, 0.2); border: 1px solid var(--sage-green); color: var(--text-light); 
            padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; cursor: grab; font-size: 0.9em; text-align: center;
        }
        .guest-card:active { cursor: grabbing; opacity: 0.7; }
        .guest-card span { display: block; font-size: 0.8em; color: #ccc; }
    </style>
</head>
<body>

    <div class="hero-section">
        <img src="gold_logo.png" alt="I and I Logo" class="logo" onerror="this.style.display='none'">
        <h1>ISHINI & ISURU</h1>
        <a href="#planner" class="scroll-down">▼ SCROLL TO ENTER ▼</a>
    </div>

    <div id="planner" class="app-container">
        <div class="glass-panel">
            <div class="tabs">
                <button class="tab-button active" onclick="openTab('dashboard')">Dashboard</button>
                <button class="tab-button" onclick="openTab('budget')">Budget</button>
                <button class="tab-button" onclick="openTab('guests')">Guests</button>
                <button class="tab-button" onclick="openTab('vendors')">Vendors</button>
                <button class="tab-button" onclick="openTab('seating')">Seating</button>
            </div>

            <!-- Dashboard -->
            <div id="dashboard" class="tab-content active">
                <h2 style="text-align:center; color: var(--sage-green); margin-bottom: 30px;">Overview</h2>
                <div class="dash-grid">
                    <div class="stat-card"><h3 id="dashGuests">0</h3><p>Total Guests</p></div>
                    <div class="stat-card"><h3 id="dashBudget">0</h3><p>Budget (LKR)</p></div>
                    <div class="stat-card"><h3 id="dashPaid">0</h3><p>Paid (LKR)</p></div>
                </div>
                <p style="text-align: center; margin-top: 30px; font-size: 0.9em; color: #888;" id="syncStatus">Syncing with Google Sheets...</p>
            </div>

            <!-- Budget -->
            <div id="budget" class="tab-content">
                <input type="hidden" id="budgetId">
                <div class="form-group"><label>Category</label>
                    <select id="budgetCategory"><option>Decorations</option><option>Photography</option><option>Videography</option><option>Poruwa</option><option>Dresses</option><option>Other</option></select>
                </div>
                <div class="form-group"><label>Specific Item</label><input type="text" id="budgetItem"></div>
                <div class="form-group"><label>Cost (LKR)</label><input type="number" id="budgetCost"></div>
                <button class="submit-btn" id="budgetBtn" onclick="submitData('Budget')">Add to Budget</button>
                <div id="budgetList"></div>
            </div>

            <!-- Guests -->
            <div id="guests" class="tab-content">
                <input type="hidden" id="guestId">
                <div class="form-group"><label>Guest Full Name</label><input type="text" id="guestName"></div>
                <div class="form-group"><label>Which side?</label>
                    <select id="guestSide"><option>Bride</option><option>Groom</option><option>Common</option></select>
                </div>
                <div class="form-group"><label>Total Party Size</label><input type="number" id="guestCount" value="1" min="1"></div>
                <button class="submit-btn" id="guestBtn" onclick="submitData('Guests')">Add Guest</button>
                <div id="guestsList"></div>
            </div>

            <!-- Vendors -->
            <div id="vendors" class="tab-content">
                <input type="hidden" id="vendorId">
                <div class="form-group"><label>Service Type</label><input type="text" id="vendorService"></div>
                <div class="form-group"><label>Vendor Name</label><input type="text" id="vendorName"></div>
                <div class="form-group"><label>Total Cost (LKR)</label><input type="number" id="vendorTotal"></div>
                <div class="form-group"><label>Amount Paid (LKR)</label><input type="number" id="vendorPaid"></div>
                <button class="submit-btn" id="vendorBtn" onclick="submitData('Vendors')">Add Vendor</button>
                <div id="vendorsList"></div>
            </div>

            <!-- Seating -->
            <div id="seating" class="tab-content">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="color: var(--sage-green); margin: 0;">Table Mapping</h2>
                    <button class="edit-btn" onclick="addTable()">+ Add Table</button>
                </div>
                <p style="font-size: 0.85em; color: #aaa;">Drag a guest from the Unassigned zone and drop them onto a table. It saves automatically.</p>
                
                <div class="seating-dashboard">
                    <div class="unassigned-zone">
                        <h4 style="margin-top:0; color: var(--text-light); text-align: center;">Unassigned</h4>
                        <div id="Unassigned" class="drop-area" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
                    </div>
                    <div class="tables-zone" id="tablesContainer">
                        <div class="wedding-table">
                            <h4>Table 1</h4>
                            <div id="Table_1" class="drop-area" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

<script>
    // --- SETUP ---
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbznMEKD4UuEpO0lVQ18tREj0FF_coIN6AC6QcQArPSNnGfxScCHbB5nuUQCsna0JcYG/exec'; // <--- PASTE DEPLOYED URL HERE
    let appData = { Budget: [], Guests: [], Vendors: [] };
    let tableCount = 1;

    // --- FETCH DATA ON LOAD ---
    window.onload = async function() {
        try {
            const res = await fetch(WEB_APP_URL);
            const json = await res.json();
            if(json.status === 'Success') {
                appData.Budget = json.data.Budget.map(r => ({ id: r[0], raw: { category: r[2], item: r[3], cost: r[4] }, title: r[3], desc: `${r[2]} | LKR ${r[4]}` }));
                appData.Guests = json.data.Guests.map(r => ({ id: r[0], raw: { name: r[2], side: r[3], partySize: r[4], table: r[5] }, title: r[2], desc: `${r[3]}'s Side | Party of ${r[4]}` }));
                appData.Vendors = json.data.Vendors.map(r => ({ id: r[0], raw: { service: r[2], vendorName: r[3], amountPaid: r[4], totalCost: r[5] }, title: r[3], desc: `${r[2]} | Total: LKR ${r[5]} | Paid: LKR ${r[4]}` }));
                
                // Initialize required tables based on saved guest data
                const highestTable = Math.max(...appData.Guests.map(g => parseInt(g.raw.table?.replace('Table_','')) || 1));
                while(tableCount < highestTable) { addTable(); }

                updateAllViews();
                document.getElementById('syncStatus').innerText = "Data synced successfully ✓";
            }
        } catch (e) {
            document.getElementById('syncStatus').innerText = "Working offline. Could not sync with Sheets.";
        }
    };

    function openTab(tabName) {
        document.querySelectorAll(".tab-content").forEach(tab => tab.classList.remove("active"));
        document.querySelectorAll(".tab-button").forEach(btn => btn.classList.remove("active"));
        document.getElementById(tabName).classList.add("active");
        event.currentTarget.classList.add("active");
    }

    function updateAllViews() {
        renderList('Budget'); 
        renderList('Guests'); 
        renderList('Vendors');
        updateDashboard();
        renderSeating();
    }

    function updateDashboard() {
        let totalGuests = appData.Guests.reduce((sum, g) => sum + Number(g.raw.partySize || 0), 0);
        let totalBudget = appData.Budget.reduce((sum, b) => sum + Number(b.raw.cost || 0), 0);
        let totalPaid = appData.Vendors.reduce((sum, v) => sum + Number(v.raw.amountPaid || 0), 0);
        
        document.getElementById('dashGuests').innerText = totalGuests;
        document.getElementById('dashBudget').innerText = totalBudget.toLocaleString();
        document.getElementById('dashPaid').innerText = totalPaid.toLocaleString();
    }

    // --- SINGLE ADD/EDIT ---
    async function submitData(type) {
        const btn = document.getElementById(type.toLowerCase() === 'guests' ? 'guestBtn' : type.toLowerCase().replace('s','') + 'Btn');
        const idField = document.getElementById(type.toLowerCase() === 'guests' ? 'guestId' : type.toLowerCase().replace('s','') + 'Id');
        
        let payload = { type: type, id: idField.value };
        let localItem = { id: payload.id || Date.now().toString() };

        if(type === 'Budget') {
            payload.category = document.getElementById('budgetCategory').value;
            payload.item = document.getElementById('budgetItem').value;
            payload.cost = document.getElementById('budgetCost').value;
            localItem.title = payload.item; localItem.desc = `${payload.category} | LKR ${payload.cost}`;
        } else if(type === 'Guests') {
            payload.name = document.getElementById('guestName').value;
            payload.side = document.getElementById('guestSide').value;
            payload.partySize = document.getElementById('guestCount').value;
            // Preserve existing table if editing, else Unassigned
            const existingGuest = appData.Guests.find(g => g.id === payload.id);
            payload.table = existingGuest ? existingGuest.raw.table : "Unassigned";
            localItem.title = payload.name; localItem.desc = `${payload.side}'s Side | Party of ${payload.partySize}`;
        } else if(type === 'Vendors') {
            payload.service = document.getElementById('vendorService').value;
            payload.vendorName = document.getElementById('vendorName').value;
            payload.totalCost = document.getElementById('vendorTotal').value;
            payload.amountPaid = document.getElementById('vendorPaid').value;
            localItem.title = payload.vendorName; localItem.desc = `${payload.service} | Total: LKR ${payload.totalCost} | Paid: LKR ${payload.amountPaid}`;
        }
        
        localItem.raw = payload;

        if (idField.value) {
            const index = appData[type].findIndex(i => i.id === payload.id);
            if(index > -1) appData[type][index] = localItem;
        } else {
            payload.id = localItem.id;
            appData[type].push(localItem);
        }
        
        updateAllViews(); 
        resetForm(type);

        try {
            btn.innerText = "Saving...";
            await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
            btn.innerText = `Saved ✓`;
            setTimeout(() => btn.innerText = `Add`, 2000);
        } catch (error) { btn.innerText = `Error Saving`; }
    }

    function renderList(type) {
        const listDiv = document.getElementById(type.toLowerCase() + 'List');
        if(!listDiv) return;
        listDiv.innerHTML = '';
        // Render in reverse so newest is on top
        [...appData[type]].reverse().forEach(item => {
            listDiv.innerHTML += `
                <div class="list-item">
                    <div><h4>${item.title}</h4><p>${item.desc}</p></div>
                    <button class="edit-btn" onclick='editItem("${type}", ${JSON.stringify(item)})'>Edit</button>
                </div>`;
        });
    }

    function editItem(type, item) {
        const prefix = type.toLowerCase() === 'guests' ? 'guest' : type.toLowerCase().replace('s','');
        document.getElementById(prefix + 'Id').value = item.id;
        document.getElementById(prefix + 'Btn').innerText = `Update`;

        if(type === 'Budget') {
            document.getElementById('budgetCategory').value = item.raw.category;
            document.getElementById('budgetItem').value = item.raw.item;
            document.getElementById('budgetCost').value = item.raw.cost;
        } else if(type === 'Guests') {
            document.getElementById('guestName').value = item.raw.name;
            document.getElementById('guestSide').value = item.raw.side;
            document.getElementById('guestCount').value = item.raw.partySize;
        } else if(type === 'Vendors') {
            document.getElementById('vendorService').value = item.raw.service;
            document.getElementById('vendorName').value = item.raw.vendorName;
            document.getElementById('vendorTotal').value = item.raw.totalCost;
            document.getElementById('vendorPaid').value = item.raw.amountPaid;
        }
        document.querySelector('.glass-panel').scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm(type) {
        const prefix = type.toLowerCase() === 'guests' ? 'guest' : type.toLowerCase().replace('s','');
        document.getElementById(prefix + 'Id').value = "";
        if(type === 'Budget') { document.getElementById('budgetItem').value = ""; document.getElementById('budgetCost').value = ""; }
        if(type === 'Guests') { document.getElementById('guestName').value = ""; document.getElementById('guestCount').value = "1"; }
        if(type === 'Vendors') { ['vendorService','vendorName','vendorTotal','vendorPaid'].forEach(id => document.getElementById(id).value = ""); }
    }

    // --- SEATING DRAG & DROP LOGIC ---
    function renderSeating() {
        document.querySelectorAll('.drop-area').forEach(zone => zone.innerHTML = '');
        
        appData.Guests.forEach(guest => {
            const card = document.createElement('div');
            card.className = 'guest-card';
            card.draggable = true;
            card.id = 'guest-' + guest.id;
            card.ondragstart = drag;
            card.innerHTML = `${guest.raw.name} <span>(Party of ${guest.raw.partySize})</span>`;
            
            let assignedTable = guest.raw.table || 'Unassigned';
            let targetZone = document.getElementById(assignedTable);
            
            if (!targetZone) { targetZone = document.getElementById('Unassigned'); }
            targetZone.appendChild(card);
        });
    }

    function addTable() {
        tableCount++;
        const tableId = 'Table_' + tableCount;
        const tableDiv = document.createElement('div');
        tableDiv.className = 'wedding-table';
        tableDiv.innerHTML = `<h4>Table ${tableCount}</h4><div id="${tableId}" class="drop-area" ondragover="allowDrop(event)" ondrop="drop(event)"></div>`;
        document.getElementById('tablesContainer').appendChild(tableDiv);
    }

    function allowDrop(event) { event.preventDefault(); }
    function drag(event) { event.dataTransfer.setData("text", event.target.id); }
    
    async function drop(event) {
        event.preventDefault();
        const guestCardId = event.dataTransfer.getData("text");
        const draggedElement = document.getElementById(guestCardId);
        if(!draggedElement) return;

        let dropZone = event.target;
        if (!dropZone.classList.contains('drop-area')) {
            dropZone = dropZone.closest('.wedding-table')?.querySelector('.drop-area');
        }
        if(!dropZone) return;
        
        // Move element visually
        dropZone.appendChild(draggedElement);

        // Update local data
        const guestRealId = guestCardId.replace('guest-', '');
        const guestIndex = appData.Guests.findIndex(g => g.id == guestRealId);
        
        if (guestIndex > -1) {
            appData.Guests[guestIndex].raw.table = dropZone.id;
            
            // Send stealth background update to Google Sheets
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'updateSeating', id: guestRealId, table: dropZone.id }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
            } catch(e) {
                console.error("Failed to sync seating update to sheets.", e);
            }
        }
    }
</script>
</body>
</html>
