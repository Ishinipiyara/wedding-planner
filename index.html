<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ishini &amp; Isuru</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%233f4a3c'/%3E%3Ctext x='16' y='21' font-size='13' text-anchor='middle' fill='%23fff' font-family='Georgia'%3EI%26I%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2; --card:#fff; --ink:#2a2522; --muted:#8b8279; --line:#ebe4d9; --soft:#f4efe7;
  --accent:#3f4a3c; --gold:#b08d57;
  --isuru:#4f6d7a; --ishini:#b5656b; --other:#b08d57;
  --good:#4f7a55; --bad:#b4493f; --radius:14px;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
  --hero-pos:center 30%;            /* move the photo focus: e.g. center 10% (higher) or center 60% (lower) */
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h2{font:500 32px/1.1 var(--serif);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 4px}
a{color:inherit}

/* hero */
.hero{position:relative;min-height:74vh;display:grid;place-items:center;text-align:center;padding:72px 20px 60px;
  background:linear-gradient(135deg,#efe5d6,#f8ece7);color:var(--ink)}
.hero.has-img{color:#fff;background:linear-gradient(rgba(24,18,14,.34),rgba(24,18,14,.6)),var(--hero-img) var(--hero-pos)/cover no-repeat}
.eyebrow{letter-spacing:.34em;text-transform:uppercase;font-size:11px;opacity:.85}
.names{font:500 clamp(46px,10vw,104px)/1 var(--serif);margin:16px 0 8px;letter-spacing:.01em}
.names i{color:var(--gold);font-weight:400;padding:0 .14em}
.when{font:italic 400 clamp(17px,2.4vw,23px) var(--serif);opacity:.92}
.count{display:flex;gap:clamp(16px,5vw,46px);justify-content:center;margin-top:36px}
.count div{min-width:62px}
.count b{display:block;font:500 clamp(34px,6.4vw,58px)/1 var(--serif);font-variant-numeric:tabular-nums}
.count span{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;opacity:.8}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(250,247,242,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1240px;margin:auto;display:flex;align-items:center;gap:10px;padding:0 16px;height:54px}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 15px;border-radius:999px;color:var(--muted);font-weight:500;font-size:13px;text-decoration:none;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.dot.warn{background:#d8a13a}.dot.bad{background:var(--bad)}.dot.off{background:#b8b0a5}

.wrap{max-width:1240px;margin:0 auto;padding:30px 16px 90px;scroll-margin-top:60px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* controls */
.btn{font:500 13px var(--sans);padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#cdc2b2}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#2f382d}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
input,select,textarea,button{font:inherit;color:inherit}
.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;outline:0;min-width:0}
.cell:hover{background:var(--soft)}
.cell:focus{background:#fff;border-color:var(--gold)}
select.cell{appearance:none;-webkit-appearance:none;cursor:pointer}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.search{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;min-width:200px;outline:0}
.search:focus{border-color:var(--gold)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font:500 12.5px var(--sans);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.x{border:0;background:none;color:#b9b0a4;cursor:pointer;font-size:18px;line-height:1;padding:4px 7px;border-radius:8px}
.x:hover{color:var(--bad);background:#fbeeec}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.bar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.pill{padding:5px 12px;border-radius:999px;font-size:12.5px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.pill b{color:var(--ink);font-weight:600}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:16px 0}
.stat{display:block;text-decoration:none;transition:.15s}
a.stat:hover{border-color:#cdc2b2;transform:translateY(-1px)}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.stat b{display:block;font:500 31px/1.15 var(--serif);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;color:var(--muted);font-size:22px}
.stat span{color:var(--muted);font-size:12.5px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.card h3{font:500 22px var(--serif);margin:0 0 10px}
.field{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin:6px 0}
.field label{color:var(--muted);font-size:12.5px}
.field .cell{border-color:var(--line);background:#fff}
.hint{color:var(--muted);font-size:12.5px;margin:8px 0 0}

/* data tables */
.tbl-wrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table.grid{border-collapse:collapse;width:100%}
.grid.wide{min-width:980px}
.grid th{position:sticky;top:0;z-index:2;background:#fbf8f3;text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.grid th[data-sort]{cursor:pointer}.grid th[data-sort]:hover{color:var(--ink)}
.grid td{padding:2px 3px;border-bottom:1px solid #f3eee6;vertical-align:middle}
.grid tr:last-child td{border-bottom:0}
.grid .c{text-align:center}.grid input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.w70{width:70px}.w90{width:92px}.w120{width:128px}.w40{width:40px}
.s-isuru{color:var(--isuru);font-weight:500}.s-ishini{color:var(--ishini);font-weight:500}.s-other{color:var(--other);font-weight:500}
.st-booked{color:var(--good);font-weight:600}.st-shortlisted{color:var(--gold);font-weight:600}
.st-rejected{color:#b9b0a4;text-decoration:line-through}.st-contacted,.st-visited{color:var(--isuru);font-weight:500}
.ext{text-decoration:none;color:var(--gold);padding:0 6px;font-weight:600}
.empty-row td{padding:30px;text-align:center;color:var(--muted)}

/* seating */
.seat-layout{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start;margin-top:14px}
.pool{position:sticky;top:68px;max-height:calc(100vh - 86px);display:flex;flex-direction:column;gap:10px;padding:14px}
.pool>*{flex-shrink:0}
.pool>.pool-list{flex:1 1 auto;min-height:70px}
.pool-h{display:flex;justify-content:space-between;align-items:baseline}
.pool-h span{color:var(--muted);font-size:12px}
.pool .search{min-width:0;width:100%}
.pool-list{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:70px;padding:2px}
.chip{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border:1px solid var(--line);border-left:4px solid var(--c,#ccc);background:#fff;border-radius:10px;cursor:grab;font-size:13px;user-select:none;-webkit-user-select:none}
.chip.isuru{--c:var(--isuru)}.chip.ishini{--c:var(--ishini)}.chip.other{--c:var(--other)}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chip .n{font-size:11px;color:var(--muted);background:var(--soft);padding:1px 8px;border-radius:999px}
.chip .un{border:0;background:none;color:#b9b0a4;cursor:pointer;font-size:16px;line-height:1;padding:0 3px}
.chip .un:hover{color:var(--bad)}
.chip.sel{outline:2px solid var(--gold);background:#fffaf0}
.chip.drag{opacity:.4}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tbl{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;transition:border-color .15s,box-shadow .15s}
.tbl.over,.pool.over{border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,87,.2)}
.picking .tbl{cursor:pointer}
.tbl-head{display:flex;gap:4px;align-items:center}
.tname{font:500 19px var(--serif)!important}
.tbl svg{display:block;margin:2px auto 8px;width:172px;height:172px}
.seat{stroke-width:1.5}
.seat.free{fill:#fff;stroke:#d8cfc2}
.seat.isuru{fill:var(--isuru);stroke:var(--isuru)}.seat.ishini{fill:var(--ishini);stroke:var(--ishini)}.seat.other{fill:var(--other);stroke:var(--other)}
.top{fill:var(--soft);stroke:var(--line);stroke-width:1.5}
.tt{font:600 24px var(--serif);fill:var(--ink)}
.over-cap .top{stroke:var(--bad)}.over-cap .tt{fill:var(--bad)}
.chips{display:flex;flex-direction:column;gap:5px;min-height:36px}
.empty{color:#b9b0a4;font-size:12.5px;text-align:center;padding:8px;border:1px dashed var(--line);border-radius:10px}
.tbl-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px;color:var(--muted);font-size:12px}
.tbl-foot .cap{width:56px;text-align:center;border-color:var(--line)}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* budget */
.plans{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.plans .pbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-weight:500;cursor:pointer}
.plans .pbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cat{padding:0;margin-top:10px;overflow:hidden}
.cat-h{display:grid;grid-template-columns:28px minmax(120px,1.3fr) repeat(3,minmax(88px,.55fr));gap:10px;align-items:center;padding:12px 16px;cursor:pointer}
.cat-h .chev{color:var(--muted);transition:.15s;font-size:12px}
.cat.open .chev{transform:rotate(90deg)}
.cat-h .cname{font:500 20px var(--serif);cursor:text}
.cat-h .cv{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.cat-h .cv small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.cat-bar{height:3px;background:var(--soft)}
.cat-bar i{display:block;height:100%;background:var(--gold);transition:width .25s}
.cat-b{display:none;padding:6px 12px 14px;border-top:1px solid var(--line)}
.cat.open .cat-b{display:block}
.cat-b .grid th{position:static;background:none;padding:8px 6px}
.cat-b .foot{display:flex;justify-content:space-between;margin-top:6px}
.compare th,.compare td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line)}
.compare th:first-child,.compare td:first-child{text-align:left}
.compare{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}

.banner{background:#fff6e5;border-bottom:1px solid #f0d9a8;padding:10px 16px;text-align:center;font-size:13px}
.banner .btn{margin-left:6px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;display:flex;gap:12px;align-items:center;max-width:92vw}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#e8c98f;font-weight:600;cursor:pointer}
dialog{border:0;border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(340px,92vw)}
dialog::backdrop{background:rgba(30,24,20,.45)}
dialog h3{font:500 24px var(--serif);margin:0 0 4px}
dialog input{width:100%;margin:12px 0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}
dialog input:focus{border-color:var(--gold)}
dialog .row{justify-content:flex-end}

@media (max-width:860px){
  .seat-layout{grid-template-columns:1fr}
  .pool{position:static;max-height:300px}
  .cat-h{grid-template-columns:22px 1fr 90px;}
  .cat-h .cv.hide-s{display:none}
  .status span{display:none}
  h2{font-size:28px}
}
</style>
</head>
<body>

<div id="banner"></div>

<header class="hero" id="hero">
  <div>
    <div class="eyebrow" id="hEyebrow">We're getting married</div>
    <h1 class="names" id="hNames">Ishini<i>&amp;</i>Isuru</h1>
    <div class="when" id="hWhen"></div>
    <div class="count" aria-live="off">
      <div><b id="cD">–</b><span>Days</span></div>
      <div><b id="cH">–</b><span>Hours</span></div>
      <div><b id="cM">–</b><span>Minutes</span></div>
      <div><b id="cS">–</b><span>Seconds</span></div>
    </div>
  </div>
</header>

<nav class="nav">
  <div class="nav-in">
    <div class="tabs" id="tabs"></div>
    <div class="status"><i class="dot warn" id="dot"></i><span id="statusText">Loading…</span></div>
  </div>
</nav>

<main class="wrap" id="main"><div id="app"></div></main>

<div id="toast"></div>

<dialog id="pinDlg">
  <form method="dialog">
    <h3>Planner PIN</h3>
    <div class="sub" id="pinMsg">Enter your PIN</div>
    <input id="pinIn" type="password" autocomplete="current-password" placeholder="PIN">
    <div class="row"><button class="btn pri" value="ok" style="order:2">Open</button><button class="btn" value="cancel" style="order:1">Cancel</button></div>
  </form>
</dialog>

<datalist id="rels"><option>Friends</option><option>Relative</option><option>Co-workers</option><option>Neighbours</option><option>Parents</option><option>Crew</option></datalist>

<script>
(() => {
'use strict';

/* ============ SETTINGS — edit these ============ */
const API_URL = '';   // ← paste your Apps Script Web app URL here (…/exec). Leave empty to try the site without syncing.
const IMAGES  = ['couple.jpg', 'couple.jpeg', 'couple.png', 'couple.webp'];   // your photo, same folder as this file
/* ================================================ */

const LS = 'ishini-isuru-planner-v1', LS_PIN = 'ishini-isuru-planner-pin';
const SIDES = [['isuru', 'Isuru'], ['ishini', 'Ishini'], ['other', 'Other']];
const RSVPS = [['', '—'], ['yes', 'Yes'], ['no', 'No'], ['maybe', 'Maybe']];
const STATUSES = ['To contact', 'Contacted', 'Visited', 'Shortlisted', 'Booked', 'Rejected'];
const TABS = [['overview', 'Overview'], ['guests', 'Guests'], ['seating', 'Seating'], ['budget', 'Budget'], ['vendors', 'Vendors']];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = v => { const x = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(x) ? x : 0; };
const fmt = v => (n(v) ? Math.round(n(v)).toLocaleString('en-US') : '');
const rs = v => 'Rs ' + Math.round(v || 0).toLocaleString('en-US');
const uid = p => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const slug = s => String(s || '').toLowerCase().replace(/[^a-z]+/g, '');
const attrs = (coll, id, k) => `data-coll="${coll}" data-id="${esc(id)}" data-k="${k}"`;
const opt = (list, val) => list.map(([v, l]) => `<option value="${esc(v)}"${v === val ? ' selected' : ''}>${esc(l)}</option>`).join('');
const seats = g => Math.max(0, n(g.count)) + Math.max(0, n(g.kids));

/* ---------- state ---------- */
let S = null, rev = 0, dirty = false, saving = false, again = false, conflict = false, timer = null;
let tab = 'overview';
const openCats = new Set();

function blankPlan(name) {
  return { id: uid('p'), name: name || 'Plan A',
    income: [{ id: uid('n'), label: 'Groom (Isuru)', amount: 0 }, { id: uid('n'), label: 'Bride (Ishini)', amount: 0 }], cats: [] };
}
function defaultState() {
  const p = blankPlan();
  return { couple: { a: 'Ishini', b: 'Isuru', date: '2027-08-12' }, guests: [],
    tables: Array.from({ length: 12 }, (_, i) => ({ id: uid('t'), label: 'Table ' + (i + 1), cap: 10 })),
    vendors: [], plans: [p], activePlan: p.id };
}
function normalise(s) {
  const d = defaultState();
  s = s && typeof s === 'object' ? s : d;
  s.couple = Object.assign({}, d.couple, s.couple || {});
  ['guests', 'tables', 'vendors'].forEach(k => { if (!Array.isArray(s[k])) s[k] = d[k]; });
  if (!Array.isArray(s.plans) || !s.plans.length) s.plans = [blankPlan()];
  s.plans.forEach(p => { p.id = p.id || uid('p'); if (!Array.isArray(p.income)) p.income = []; if (!Array.isArray(p.cats)) p.cats = []; p.cats.forEach(c => { if (!Array.isArray(c.items)) c.items = []; }); });
  if (!s.plans.some(p => p.id === s.activePlan)) s.activePlan = s.plans[0].id;
  return s;
}
const plan = () => S.plans.find(p => p.id === S.activePlan) || S.plans[0];
const readLocal = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
const writeLocal = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
const getPin = () => { try { return localStorage.getItem(LS_PIN) || ''; } catch (e) { return ''; } };
const setPin = p => { try { localStorage.setItem(LS_PIN, p); } catch (e) {} };

/* ---------- sync ---------- */
function setStatus(kind, text) {
  $('#dot').className = 'dot ' + (kind === 'ok' ? '' : kind);
  $('#statusText').textContent = text;
}
async function apiGet(params) {
  const u = new URL(API_URL);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u, { redirect: 'follow' });
  return r.json();
}
async function apiPost(body) {
  const r = await fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}
function askPin(msg) {
  return new Promise(res => {
    const d = $('#pinDlg'), inp = $('#pinIn');
    $('#pinMsg').textContent = msg || 'Enter your PIN';
    inp.value = '';
    d.returnValue = '';
    d.onclose = () => res(d.returnValue === 'ok' ? inp.value : null);
    d.showModal(); inp.focus();
  });
}
async function loadRemote() {
  let res = await apiGet({ action: 'load', pin: getPin() }), tries = 0;
  while (res.error === 'auth') {
    const p = await askPin(tries++ ? 'That PIN did not match — try again' : 'Enter your planner PIN');
    if (p === null) throw new Error('auth cancelled');
    setPin(p);
    res = await apiGet({ action: 'load', pin: p });
  }
  if (!res.ok) throw new Error(res.error || 'load failed');
  rev = res.rev;
  if (res.state) { S = normalise(res.state); }
  else { S = normalise(readLocal() || defaultState()); touchSave(); }
  writeLocal();
  if (!dirty) setStatus('ok', 'Synced');
}
function touchSave() {
  dirty = true; writeLocal();
  if (!API_URL) { dirty = false; setStatus('off', 'Saved on this device only'); return; }
  setStatus('warn', 'Saving…');
  clearTimeout(timer); timer = setTimeout(() => flush(), 900);
}
async function flush(force) {
  if (!API_URL || (conflict && !force)) return;
  if (saving) { again = true; return; }
  saving = true; dirty = false;
  try {
    const res = await apiPost({ action: 'save', pin: getPin(), baseRev: rev, state: S, force: force || undefined });
    if (res.ok) { rev = res.rev; if (!dirty && !again) setStatus('ok', 'Saved'); }
    else if (res.error === 'conflict') { conflict = true; dirty = true; showConflict(); setStatus('bad', 'Needs your attention'); }
    else if (res.error === 'auth') { dirty = true; const p = await askPin('PIN needed to save'); if (p !== null) { setPin(p); setTimeout(() => flush(), 0); } }
    else throw new Error(res.error);
  } catch (e) { dirty = true; setStatus('bad', 'Not saved — retrying'); setTimeout(() => flush(), 6000); }
  finally { saving = false; if (again) { again = false; flush(); } }
}
function showConflict() {
  $('#banner').innerHTML = `<div class="banner">Someone else saved changes while you were editing.
    <button class="btn sm" data-act="take-theirs">Load their version</button>
    <button class="btn sm pri" data-act="keep-mine">Keep mine</button></div>`;
}
const editing = () => { const a = document.activeElement; return a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && $('#app').contains(a); };
setInterval(async () => {
  if (!API_URL || !S || dirty || saving || conflict || document.hidden || editing()) return;

    if (r.ok && r.rev > rev) { await loadRemote(); render(); toast('Updated with the latest changes'); }

function toast(msg, label, fn) {

}

/* ---------- calculations ---------- */
const proj = i => (n(i.actual) > 0 ? n(i.actual) : n(i.est));
function catTotals(c) {
  return c.items.reduce((a, i) => ({ est: a.est + n(i.est), act: a.act + n(i.actual), paid: a.paid + n(i.paid), proj: a.proj + proj(i), left: a.left + Math.max(0, proj(i) - n(i.paid)) }), { est: 0, act: 0, paid: 0, proj: 0, left: 0 });
}
function planTotals(p) {
  const t = p.cats.reduce((a, c) => { const x = catTotals(c); for (const k in x) a[k] += x[k]; return a; }, { est: 0, act: 0, paid: 0, proj: 0, left: 0 });
  t.income = p.income.reduce((a, x) => a + n(x.amount), 0);
  t.bal = t.income - t.proj;
  return t;
}
function guestStats() {
  const g = S.guests, sum = (a, k) => a.reduce((s, x) => s + n(x[k]), 0), by = s => g.filter(x => x.side === s);
  return { entries: g.length, total: sum(g, 'count'), kids: sum(g, 'kids'), liquor: sum(g, 'liquor'), sent: g.filter(x => x.sent).length,
    yes: g.filter(x => x.rsvp === 'yes').length, isuru: sum(by('isuru'), 'count'), ishini: sum(by('ishini'), 'count'), other: sum(by('other'), 'count'),
    need: g.reduce((a, x) => a + seats(x), 0), seated: g.filter(x => x.table).reduce((a, x) => a + seats(x), 0) };
}

  <h3 style="font:500 22px var(--serif);margin:22px 0 0">Categories</h3>
  ${p.cats.map(catCard).join('')}
  <div style="margin-top:12px"><button class="btn" data-act="add-cat">+ Add category</button></div>
  ${cmp}`;
}
function refreshBudget() {
  if (tab !== 'budget') return;
  const p = plan(), t = planTotals(p);
  $$('[data-sum]').forEach(el => { const k = el.dataset.sum; el.textContent = rs(t[k]); if (k === 'bal') el.className = t.bal >= 0 ? 'pos' : 'neg'; });
  p.cats.forEach(c => {
    const x = catTotals(c), map = { est: x.est, act: x.act, paid: x.paid };
    $$(`[data-csum^="${c.id}:"]`).forEach(el => { el.textContent = map[el.dataset.csum.split(':')[1]] ? rs(map[el.dataset.csum.split(':')[1]]) : '–'; });
    const bar = $(`[data-cbar="${c.id}"]`); if (bar) bar.style.width = (x.proj > 0 ? Math.min(100, x.paid / x.proj * 100) : 0) + '%';
  });
}

/* ----- vendors ----- */
const vf = { q: '', cat: 'all' };
function filteredVendors() {
  const q = vf.q.trim().toLowerCase();
  return S.vendors.filter(v => (vf.cat === 'all' || v.cat === vf.cat) && (!q || (v.name + ' ' + v.notes + ' ' + v.cat).toLowerCase().includes(q)));
}
function vendorRow(v) {
  const link = /^https?:\/\//i.test(v.link || '') ? `<a class="ext" href="${esc(v.link)}" target="_blank" rel="noopener" title="Open link">↗</a>` : '';
  return `<tr>
    <td class="w120"><input class="cell" list="vcats" ${attrs('vendor', v.id, 'cat')} value="${esc(v.cat)}"></td>
    <td><input class="cell" ${attrs('vendor', v.id, 'name')} value="${esc(v.name)}" placeholder="Vendor name"></td>
    <td class="w120"><select class="cell st-${slug(v.status)}" ${attrs('vendor', v.id, 'status')}>${opt(STATUSES.map(s => [s, s]), v.status)}</select></td>
    <td class="w120"><input class="cell num money" inputmode="decimal" ${attrs('vendor', v.id, 'quote')} value="${fmt(v.quote)}" placeholder="Quote"></td>
    <td class="w120"><input class="cell" ${attrs('vendor', v.id, 'phone')} value="${esc(v.phone)}" placeholder="Phone"></td>
    <td style="min-width:150px"><div class="row" style="flex-wrap:nowrap;gap:0"><input class="cell" ${attrs('vendor', v.id, 'link')} value="${esc(v.link)}" placeholder="Link / social">${link}</div></td>
    <td style="min-width:200px"><input class="cell" ${attrs('vendor', v.id, 'notes')} value="${esc(v.notes)}" placeholder="Notes"></td>
    <td class="w40"><button class="x" data-act="del-vendor" data-id="${v.id}" aria-label="Remove vendor">×</button></td></tr>`;
}
function vendorRows() { const l = filteredVendors(); return l.length ? l.map(vendorRow).join('') : `<tr class="empty-row"><td colspan="8">No vendors here yet.</td></tr>`; }
function vendorPills() {
  const b = S.vendors.filter(v => v.status === 'Booked');
  return `<span class="pill"><b>${S.vendors.length}</b> vendors</span><span class="pill"><b>${b.length}</b> booked</span><span class="pill"><b>${S.vendors.filter(v => v.status === 'Shortlisted').length}</b> shortlisted</span><span class="pill">Booked total <b>${rs(b.reduce((a, v) => a + n(v.quote), 0))}</b></span>`;
}
function vendorCats() {
  const cats = [...new Set(S.vendors.map(v => v.cat).filter(Boolean))];
  return [['all', `All (${S.vendors.length})`]].concat(cats.map(c => [c, `${c} (${S.vendors.filter(v => v.cat === c).length})`]));
}
function vVendors() {
  return `<div class="head"><div><h2>Vendors</h2><p class="sub">Compare quotes, track who you’ve contacted, and mark who’s booked.</p></div>
    <button class="btn pri" data-act="add-vendor">+ Add vendor</button></div>
  <div class="pills" id="vpills">${vendorPills()}</div>
  <div class="bar-row"><input class="search" id="vq" placeholder="Search vendors…" value="${esc(vf.q)}"><div class="seg" id="vcatseg">${vendorCats().map(([k, l]) => `<button data-cat="${esc(k)}" class="${vf.cat === k ? 'on' : ''}">${esc(l)}</button>`).join('')}</div></div>
  <datalist id="vcats">${[...new Set(S.vendors.map(v => v.cat).filter(Boolean))].map(c => `<option>${esc(c)}</option>`).join('')}</datalist>
  <div class="tbl-wrap"><table class="grid wide"><thead><tr><th>Category</th><th>Name</th><th>Status</th><th class="num">Quote (Rs)</th><th>Phone</th><th>Link</th><th>Notes</th><th></th></tr></thead><tbody id="vbody">${vendorRows()}</tbody></table></div>`;
}
const refreshVendors = () => { if (tab === 'vendors') { $('#vbody').innerHTML = vendorRows(); $('#vpills').innerHTML = vendorPills(); } };

/* ---------- editing (one delegate for every field) ---------- */
function rec(coll, id) {
  const p = plan();
  switch (coll) {
    case 'couple': return S.couple;
    case 'guest': return S.guests.find(x => x.id === id);
    case 'vendor': return S.vendors.find(x => x.id === id);
    case 'table': return S.tables.find(x => x.id === id);
    case 'plan': return S.plans.find(x => x.id === id);
    case 'income': return p.income.find(x => x.id === id);
    case 'cat': return p.cats.find(x => x.id === id);
    case 'item': for (const c of p.cats) { const i = c.items.find(x => x.id === id); if (i) return i; }
  }
}
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset; if (!d || !d.coll) return;
  const r = rec(d.coll, d.id); if (!r) return;
  let v = t.type === 'checkbox' ? t.checked : (t.classList.contains('money') || t.type === 'number') ? n(t.value) : t.value;
  if (d.k === 'table' && v === '') v = null;
  r[d.k] = v; touchSave();
  if (d.coll === 'couple') renderHero();
  if (d.coll === 'guest') { if (d.k === 'side') t.className = 'cell s-' + v; $('#gpills').innerHTML = guestPills(); }
  if (d.coll === 'vendor') { if (d.k === 'status') t.className = 'cell st-' + slug(v); $('#vpills').innerHTML = vendorPills(); }
  if (['income', 'item', 'cat'].includes(d.coll)) refreshBudget();
});
document.addEventListener('change', e => {
  const d = e.target.dataset;
  if (d && d.coll === 'table' && d.k === 'cap' && tab === 'seating') refreshSeating();
  if (d && d.coll === 'plan' && tab === 'budget') render();
  if (d && d.coll === 'vendor' && d.k === 'cat') { refreshVendors(); $('#vcatseg').innerHTML = vendorCats().map(([k, l]) => `<button data-cat="${esc(k)}" class="${vf.cat === k ? 'on' : ''}">${esc(l)}</button>`).join(''); }
});
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('money')) e.target.value = n(e.target.value) || ''; });
document.addEventListener('focusout', e => { if (e.target.classList && e.target.classList.contains('money')) e.target.value = fmt(e.target.value); });

/* search / filters */
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'gq') { gf.q = e.target.value; $('#gbody').innerHTML = guestRows(); }
  if (id === 'vq') { vf.q = e.target.value; $('#vbody').innerHTML = vendorRows(); }
  if (id === 'pq') { poolQ = e.target.value; $('#poolList').innerHTML = poolList(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'grel') { gf.rel = e.target.value; $('#gbody').innerHTML = guestRows(); }
  if (e.target.id === 'importFile' || e.target.id === 'importFile2') importFile(e.target.files[0]);
});

/* ---------- actions ---------- */
function addItemTo(cid) { const c = plan().cats.find(x => x.id === cid); const i = { id: uid('i'), name: '', est: 0, actual: 0, paid: 0, note: '' }; c.items.push(i); openCats.add(cid); touchSave(); render(); const el = $(`[data-id="${i.id}"][data-k="name"]`); el && el.focus(); }
function dupPlan(p, name) {
  const cp = JSON.parse(JSON.stringify(p)); cp.id = uid('p'); cp.name = name;
  cp.income.forEach(x => x.id = uid('n')); cp.cats.forEach(c => { c.id = uid('c'); c.items.forEach(i => i.id = uid('i')); });
  return cp;
}
function act(a, b) {
  const id = b.dataset.id, p = plan();
  switch (a) {
    case 'add-guest': {
      const g = { id: uid('g'), name: '', side: ['isuru', 'ishini', 'other'].includes(gf.side) ? gf.side : 'isuru', rel: gf.rel !== 'all' ? gf.rel : 'Friends', count: 1, liquor: 0, kids: 0, sent: false, rsvp: '', table: null, notes: '' };
      S.guests.unshift(g); gf.q = ''; $('#gq').value = ''; touchSave(); refreshGuests();
      const el = $(`[data-id="${g.id}"][data-k="name"]`); el && el.focus(); break;
    }
    case 'del-guest': removeFrom(S.guests, id, refreshGuests); break;
    case 'add-table': { const t = { id: uid('t'), label: 'Table ' + (S.tables.length + 1), cap: 10 }; S.tables.push(t); touchSave(); refreshSeating(); break; }
    case 'del-table': {
      const on = S.guests.filter(g => g.table === id);
      if (on.length && !confirm(`Remove this table? Its ${on.length} guest entr${on.length > 1 ? 'ies' : 'y'} will go back to Unseated.`)) break;
      on.forEach(g => g.table = null); removeFrom(S.tables, id, refreshSeating); break;
    }
    case 'clear-seating': if (confirm('Move every guest back to Unseated?')) { S.guests.forEach(g => g.table = null); touchSave(); refreshSeating(); } break;
    case 'unseat': assign(b.dataset.gid, null); break;
    case 'plan': S.activePlan = id; touchSave(); render(); break;
    case 'new-plan': { const np = blankPlan('Plan ' + String.fromCharCode(65 + S.plans.length)); S.plans.push(np); S.activePlan = np.id; touchSave(); render(); break; }
    case 'dup-plan': { const np = dupPlan(p, p.name + ' copy'); S.plans.push(np); S.activePlan = np.id; touchSave(); render(); toast('Duplicated — edit the copy freely'); break; }
    case 'del-plan': if (S.plans.length > 1 && confirm(`Delete "${p.name}"?`)) { S.plans = S.plans.filter(x => x.id !== p.id); S.activePlan = S.plans[0].id; touchSave(); render(); } break;
    case 'add-cat': { const c = { id: uid('c'), name: 'New category', open: true, items: [] }; p.cats.push(c); openCats.add(c.id); touchSave(); render(); const el = $(`[data-id="${c.id}"][data-k="name"]`); el && (el.focus(), el.select()); break; }
    case 'del-cat': { const c = p.cats.find(x => x.id === id); if (!c.items.length || confirm(`Delete "${c.name}" and its ${c.items.length} item(s)?`)) removeFrom(p.cats, id, render); break; }
    case 'toggle-cat': { openCats.has(id) ? openCats.delete(id) : openCats.add(id); b.closest('.cat').classList.toggle('open'); break; }
    case 'add-item': addItemTo(id); break;
    case 'del-item': for (const c of p.cats) { if (c.items.some(i => i.id === id)) { removeFrom(c.items, id, () => { render(); }); break; } } break;
    case 'add-income': p.income.push({ id: uid('n'), label: '', amount: 0 }); touchSave(); render(); break;
    case 'del-income': removeFrom(p.income, id, render); break;
    case 'add-vendor': {
      const v = { id: uid('v'), cat: vf.cat !== 'all' ? vf.cat : '', name: '', phone: '', link: '', status: 'To contact', quote: 0, notes: '' };
      S.vendors.unshift(v); vf.q = ''; $('#vq').value = ''; touchSave(); refreshVendors();
      const el = $(`[data-id="${v.id}"][data-k="name"]`); el && el.focus(); break;
    }
    case 'del-vendor': removeFrom(S.vendors, id, () => { refreshVendors(); }); break;
    case 'export': {
      const a2 = document.createElement('a'); a2.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
      a2.download = `wedding-backup-${new Date().toISOString().slice(0, 10)}.json`; a2.click(); break;
    }
    case 'forget-pin': setPin(''); toast('PIN forgotten on this device'); break;
    case 'take-theirs': conflict = false; dirty = false; $('#banner').innerHTML = ''; loadRemote().then(render).catch(() => toast('Could not reach the server')); break;
    case 'keep-mine': conflict = false; $('#banner').innerHTML = ''; flush(true); break;
  }
}
async function importFile(f) {
  if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    if (!obj || !Array.isArray(obj.guests) || !Array.isArray(obj.plans)) throw new Error('bad file');
    if ((S.guests.length || S.vendors.length) && !confirm('This replaces everything currently in the planner. Continue?')) return;
    S = normalise(obj); touchSave(); render(); toast('Imported ✓');
  } catch (e) { toast('That file doesn’t look like a planner backup'); }
}

/* ---------- global clicks, drag & drop ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('.cat-h') && t.tagName === 'INPUT') return;                 // editing a category name shouldn't collapse it
  const b = t.closest('[data-act]');
  if (b) { act(b.dataset.act, b); return; }
  const sideBtn = t.closest('#gside [data-side]');
  if (sideBtn) { gf.side = sideBtn.dataset.side; $$('#gside button').forEach(x => x.classList.toggle('on', x === sideBtn)); $('#gbody').innerHTML = guestRows(); return; }
  const pBtn = t.closest('#pside [data-side]');
  if (pBtn) { poolSide = pBtn.dataset.side; $$('#pside button').forEach(x => x.classList.toggle('on', x === pBtn)); $('#poolList').innerHTML = poolList(); return; }
  const cBtn = t.closest('#vcatseg [data-cat]');
  if (cBtn) { vf.cat = cBtn.dataset.cat; $$('#vcatseg button').forEach(x => x.classList.toggle('on', x === cBtn)); $('#vbody').innerHTML = vendorRows(); return; }
  const th = t.closest('th[data-sort]');
  if (th) { const k = th.dataset.sort; gsort.dir = gsort.k === k ? -gsort.dir : 1; gsort.k = k; render(); return; }
  if (tab === 'seating') {                                                   // tap to pick, tap to place
    const c = t.closest('.chip');
    if (c) { sel = sel === c.dataset.gid ? null : c.dataset.gid; refreshSeating(); if (sel) toast('Now tap a table to seat them'); return; }
    if (sel && !/^(INPUT|BUTTON)$/.test(t.tagName)) {
      const tb = t.closest('[data-drop]'); if (tb) assign(sel, tb.dataset.drop === 'table' ? tb.dataset.id : null);
    }
  }
});
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.chip'); if (!c) return;
  dragId = c.dataset.gid; e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => c.classList.add('drag'), 0);
});
document.addEventListener('dragend', () => { dragId = null; $$('.drag,.over').forEach(x => x.classList.remove('drag', 'over')); });
document.addEventListener('dragover', e => {
  if (!dragId) return;
  const d = e.target.closest && e.target.closest('[data-drop]');
  $$('.over').forEach(x => x !== d && x.classList.remove('over'));
  if (d) { e.preventDefault(); d.classList.add('over'); }
});
document.addEventListener('drop', e => {
  if (!dragId) return;
  const d = e.target.closest && e.target.closest('[data-drop]'); if (!d) return;
  e.preventDefault(); const id = dragId; dragId = null;
  assign(id, d.dataset.drop === 'table' ? d.dataset.id : null);
});

/* ---------- routing & boot ---------- */
function route() { const h = (location.hash || '#overview').slice(1); tab = TABS.some(t => t[0] === h) ? h : 'overview'; sel = null; render(); }
window.addEventListener('hashchange', () => { route(); const y = $('#main').getBoundingClientRect().top + scrollY - 56; if (scrollY > y) scrollTo({ top: y }); });

(async function init() {
  loadHeroImage();
  const cached = readLocal();
  if (!API_URL) { S = normalise(cached || defaultState()); setStatus('off', 'Saved on this device only'); route(); return; }
  S = normalise(cached || defaultState());          // show something instantly, then replace with the shared copy
  route(); setStatus('warn', 'Loading…');
  try { await loadRemote(); route(); }
  catch (e) { setStatus('bad', 'Offline — showing this device’s copy'); }
})();
})();
</script>
</body>
</html>
