<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishini & Isuru | Wedding Planner</title>
    <style>
        :root {
            --sage-green: #A3B18A;
            --dark-sage: #588157;
            --off-white: #DAD7CD;
            --white: #FFFFFF;
            --text-dark: #3A5A40;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--white);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Hero Section */
        .hero {
            padding: 60px 20px;
            background-color: var(--off-white);
        }
        .hero img.logo {
            width: 120px;
            margin-bottom: 20px;
        }
        .hero h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: var(--dark-sage);
        }
        .image-gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .image-gallery img {
            width: 300px;
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            background-color: var(--sage-green);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .tab-button {
            background: none;
            border: none;
            color: var(--white);
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 20px;
            cursor: pointer;
            padding: 10px;
            transition: 0.3s;
        }
        .tab-button:hover, .tab-button.active {
            border-bottom: 2px solid var(--white);
            font-weight: bold;
        }

        /* Content Sections */
        .tab-content {
            display: none;
            padding: 50px;
            max-width: 800px;
            margin: 0 auto;
            text-align: left;
        }
        .tab-content.active {
            display: block;
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--sage-green);
            border-radius: 4px;
            box-sizing: border-box;
        }
        button.submit-btn {
            background-color: var(--dark-sage);
            color: var(--white);
            border: none;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }
        button.submit-btn:hover {
            background-color: var(--sage-green);
        }
    </style>
</head>
<body>

    <div class="hero">
        <img src="gold_logo.png" alt="I and I Logo" class="logo" onerror="this.style.display='none'">
        <h1>ISHINI & ISURU</h1>
        <div class="image-gallery">
            <img src="couple_image_1.jpg" alt="Ishini and Isuru 1">
            <img src="couple_image_2.jpg" alt="Ishini and Isuru 2">
        </div>
    </div>

    <div class="tabs">
        <button class="tab-button active" onclick="openTab('budget')">Budget</button>
        <button class="tab-button" onclick="openTab('guests')">Guest List</button>
        <button class="tab-button" onclick="openTab('seating')">Seating</button>
        <button class="tab-button" onclick="openTab('vendors')">Vendors & Payments</button>
    </div>

    <!-- Budget Tab -->
    <div id="budget" class="tab-content active">
        <h2>Budget Planner</h2>
        <div class="form-group">
            <label>Category</label>
            <select id="budgetCategory">
                <option value="Decorations">Decorations</option>
                <option value="Photography">Photography</option>
                <option value="Videography">Videography</option>
                <option value="Poruwa">Poruwa</option>
                <option value="Dresses">Dresses/Attire</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Specific Item/Detail</label>
            <input type="text" id="budgetItem" placeholder="e.g. Bridal Bouquet">
        </div>
        <div class="form-group">
            <label>Estimated/Actual Cost (LKR)</label>
            <input type="number" id="budgetCost" placeholder="0.00">
        </div>
        <button class="submit-btn" onclick="submitData('addBudget')">Add to Budget</button>
    </div>

    <!-- Guest List Tab -->
    <div id="guests" class="tab-content">
        <h2>Guest List Management</h2>
        <div class="form-group">
            <label>Guest Full Name (Primary)</label>
            <input type="text" id="guestName" placeholder="e.g. Mr. John Doe">
        </div>
        <div class="form-group">
            <label>Which side?</label>
            <select id="guestSide">
                <option value="Bride">Bride's Side</option>
                <option value="Groom">Groom's Side</option>
                <option value="Common">Common Guest</option>
            </select>
        </div>
        <div class="form-group">
            <label>Total Party Size (including primary guest)</label>
            <input type="number" id="guestCount" value="1" min="1">
        </div>
        <button class="submit-btn" onclick="submitData('addGuest')">Add Guest</button>
    </div>

    <!-- Seating Tab -->
    <div id="seating" class="tab-content">
        <h2>Seating Arrangement</h2>
        <p><i>Note: To map seats visually, we will link this to the Google Sheet backend in phase 2 so you can drag-and-drop or select tables for the guests you've added.</i></p>
    </div>

    <!-- Vendors Tab -->
    <div id="vendors" class="tab-content">
        <h2>Vendors & Payments</h2>
        <div class="form-group">
            <label>Service Type</label>
            <input type="text" id="vendorService" placeholder="e.g. Catering">
        </div>
        <div class="form-group">
            <label>Vendor Name</label>
            <input type="text" id="vendorName" placeholder="Company or Person name">
        </div>
        <div class="form-group">
            <label>Total Cost Negotiated (LKR)</label>
            <input type="number" id="vendorTotal" placeholder="0.00">
        </div>
        <div class="form-group">
            <label>Advance/Amount Paid So Far (LKR)</label>
            <input type="number" id="vendorPaid" placeholder="0.00">
        </div>
        <button class="submit-btn" onclick="submitData('addVendor')">Add Vendor Payment</button>
    </div>

    <script>
        // Replace with your deployed Google Apps Script Web App URL
        const WEB_APP_URL = 'YOUR_WEB_APP_URL_HERE';

        function openTab(tabName) {
            let i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            event.currentTarget.className += " active";
        }

        async function submitData(actionType) {
            let payload = { action: actionType };

            if(actionType === 'addBudget') {
                payload.category = document.getElementById('budgetCategory').value;
                payload.item = document.getElementById('budgetItem').value;
                payload.cost = document.getElementById('budgetCost').value;
            } 
            else if(actionType === 'addGuest') {
                payload.name = document.getElementById('guestName').value;
                payload.side = document.getElementById('guestSide').value;
                payload.partySize = document.getElementById('guestCount').value;
            }
            else if(actionType === 'addVendor') {
                payload.service = document.getElementById('vendorService').value;
                payload.vendorName = document.getElementById('vendorName').value;
                payload.totalCost = document.getElementById('vendorTotal').value;
                payload.amountPaid = document.getElementById('vendorPaid').value;
            }

            try {
                // Change button text to show loading
                const btn = event.target;
                const originalText = btn.innerText;
                btn.innerText = "Saving...";
                btn.disabled = true;

                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                
                const result = await response.json();
                if(result.status === 'Success') {
                    alert('Saved successfully!');
                    // Clear inputs based on tab (optional enhancement)
                } else {
                    alert('Error saving data. Please try again.');
                }

                btn.innerText = originalText;
                btn.disabled = false;

            } catch (error) {
                alert('Network error. Check console and URL.');
                console.error(error);
            }
        }
    </script>
</body>
</html>
